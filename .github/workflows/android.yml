name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Clean Code
      run: |
        rm -rf extracted_code
        mkdir extracted_code
        unzip -o *.zip -d extracted_code
        if [ -d "extracted_code/app" ]; then
          cp -r extracted_code/* .
        else
          cp -r extracted_code/*/* . 2>/dev/null || true
        fi

        # VoiceSpeaker.kt me line 150 ke baad ki duplicate lines automatically hatayein
        VOICE_FILE=$(find app/src/main/java -name "VoiceSpeaker.kt" | head -n 1)
        if [ -n "$VOICE_FILE" ]; then
          sed -i '150,$d' "$VOICE_FILE"
          echo "}" >> "$VOICE_FILE"
        fi

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
