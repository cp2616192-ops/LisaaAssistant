name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean and Extract Project
      run: |
        rm -rf extracted
        mkdir extracted
        unzip -o Module4.zip.zip -d extracted || unzip -o Module4.zip -d extracted
        GRADLEW_PATH=$(find extracted -name "gradlew" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug -Dorg.gradle.daemon=false
        
    - name: Copy Built APK
      run: |
        APK_PATH=$(find extracted -name "app-debug.apk" | head -n 1)
        mkdir -p build_output
        cp "$APK_PATH" build_output/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: build_output/app-debug.apk
        
