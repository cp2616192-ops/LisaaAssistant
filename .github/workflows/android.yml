name: Build Lisaa APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract All Zip Files
      run: |
        find . -type f -name "*.zip" -exec unzip -o {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Compatible Gradle
      run: |
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # Generate Gradle Wrapper with version 8.2.1 for Kotlin/kapt compatibility
          gradle wrapper --gradle-version 8.2.1
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "No build.gradle found in project!"
          exit 1
        fi

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        
