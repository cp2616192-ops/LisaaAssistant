name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Extract Code Only
      run: |
        unzip -o Module4.zip.zip -d extracted || unzip -o Module4.zip -d extracted
        find extracted -name "gradlew" -exec dirname {} \; | head -n 1 > dir.txt
        TARGET_DIR=$(cat dir.txt)
        cp -r $TARGET_DIR/* .
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug -Dorg.gradle.daemon=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
