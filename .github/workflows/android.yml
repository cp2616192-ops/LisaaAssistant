name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Prepare Project
      run: |
        rm -rf extracted_code
        mkdir extracted_code
        unzip -o *.zip -d extracted_code
        if [ -d "extracted_code/app" ]; then
          cp -r extracted_code/* .
        else
          cp -r extracted_code/*/* . 2>/dev/null || true
        fi

    - name: Fix VoiceSpeaker File
      run: |
        VOICE_FILE=$(find app/src/main/java -name "VoiceSpeaker.kt" | head -n 1)
        if [ -n "$VOICE_FILE" ]; then
          echo 'package com.khanu.lisaa.voice

import android.content.Context
import android.speech.tts.TextToSpeech
import android.util.Log
import java.util.Locale

class VoiceSpeaker(context: Context) : TextToSpeech.OnInitListener {

    private var tts: TextToSpeech? = TextToSpeech(context, this)
    private var isReady = false
    private var pendingText: String? = null

    override fun onInit(status: Int) {
        if (status == TextToSpeech.SUCCESS) {
            val result = tts?.setLanguage(Locale("hi", "IN"))
            if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                tts?.language = Locale.US
            }
            isReady = true
            Log.d("VoiceSpeaker", "TTS Engine Ready!")
            
            pendingText?.let {
                speak(it)
                pendingText = null
            }
        } else {
            Log.e("VoiceSpeaker", "TTS Initialization Failed!")
        }
    }

    fun speak(text: String) {
        if (isReady) {
            tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "LisaaTTS")
        } else {
            pendingText = text
        }
    }

    fun stop() {
        tts?.stop()
    }

    fun shutdown() {
        tts?.stop()
        tts?.shutdown()
    }
}' > "$VOICE_FILE"
        fi

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
