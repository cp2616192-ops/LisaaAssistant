name: Build Lisaa APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Find and Extract Zip File
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
        else
          echo "No zip file found!"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Permission & Build
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found!"
          exit 1
        fi

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        
