name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Module4
      run: |
        unzip -o Module4.zip.zip -d . || unzip -o Module4.zip -d .

    - name: Move all files to root
      run: |
        find . -name "gradlew" -exec dirname {} \; | head -n 1 > gradlew_dir.txt
        GRADLEW_DIR=$(cat gradlew_dir.txt)
        if [ -n "$GRADLEW_DIR" ] && [ "$GRADLEW_DIR" != "." ]; then
          cp -r $GRADLEW_DIR/* .
        fi
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug -Dorg.gradle.daemon=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
