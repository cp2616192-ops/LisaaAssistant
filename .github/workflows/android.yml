name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Prepare Project
      run: |
        rm -rf extracted_code
        mkdir extracted_code
        unzip -o *.zip -d extracted_code
        
        if [ -d "extracted_code/app" ]; then
          cp -r extracted_code/* .
        else
          cp -r extracted_code/*/* . 2>/dev/null || true
        fi
        
        # Automatic Gradle Wrapper generate karna (Compatible Version)
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Build APK with Wrapper
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
