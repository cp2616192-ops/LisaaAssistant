name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Module4
      run: |
        unzip -o Module4.zip.zip -d . || unzip -o Module4.zip -d .

    - name: Move files if nested
      run: |
        if [ -d "Module4/LisaaAssistant" ]; then
          cp -r Module4/LisaaAssistant/* .
        elif [ -d "./Module4/LisaaAssistant" ]; then
          cp -r ./Module4/LisaaAssistant/* .
        elif [ -d "LisaaAssistant" ]; then
          cp -r LisaaAssistant/* .
        fi

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        find . -name "gradlew" -exec cp {} . \;

    - name: Build APK
      run: ./gradlew assembleDebug -Dorg.gradle.daemon=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
