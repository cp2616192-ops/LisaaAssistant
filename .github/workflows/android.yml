name: Build Lisaa APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract All Zip Files
      run: |
        find . -type f -name "*.zip" -exec unzip -o {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK (Auto Gradle Wrapper Fix)
      run: |
        # Find where build.gradle or build.gradle.kts is located
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # If gradlew doesn't exist, create it automatically
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "No build.gradle found in project!"
          exit 1
        fi

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Lisaa-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        
