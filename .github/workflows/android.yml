name: Build Lisaa APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # Step 1: Zip file ko GitHub server par extract karna
    - name: Unzip Project Archive
      run: |
        if [ -f "Module4.zip" ]; then
          echo "Unzipping Module4.zip..."
          unzip -o Module4.zip
        fi

    # Step 2: Java 17 Setup
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Gradle Execute Permission
    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    # Step 4: APK Build
    - name: Build with Gradle
      run: |
        if [ -d "LisaaAssistant" ]; then
          cd LisaaAssistant
        fi
        ./gradlew assembleDebug

    # Step 5: Ready APK Artifact Upload
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Lisaa-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
        
